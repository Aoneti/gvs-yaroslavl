name: Fetch incidents

# Раз в 12 часов скачивает действующие аварии и отключения ЖКХ с moydom-yaroslavl.ru,
# кладёт их в incidents.json и коммитит. Браузер читает уже этот файл — CORS не мешает.

on:
  schedule:
    # cron в UTC: 00:00 и 12:00 UTC — это 03:00 и 15:00 по Москве.
    # Нужно 00:00 и 12:00 по Москве? Поставьте '0 9,21 * * *'.
    - cron: '0 0,12 * * *'
  workflow_dispatch: # ручной запуск: Actions → Fetch incidents → Run workflow

permissions:
  contents: write # коммит incidents.json
  pages: write # запрос пересборки GitHub Pages (см. последний шаг)

# Два запуска одновременно (например, ручной и по расписанию) не должны конфликтовать при push.
concurrency:
  group: fetch-incidents
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Скачивание всех страниц, фильтр status.type = "in", группировка → incidents.json.
      # Если API недоступен, шаг падает, а прежний incidents.json остаётся нетронутым.
      - name: Download and group incidents
        id: fetch
        run: node scripts/fetch-incidents.mjs

      - name: Commit if changed
        id: commit
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incidents.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "incidents.json не изменился — коммит не нужен"
            exit 0
          fi

          git commit -m "chore(incidents): $(date -u +'%Y-%m-%d %H:%M') UTC, $SUMMARY"
          # Если за время работы в ветку что-то запушили, подтягиваем и пробуем ещё раз
          git push || { git pull --rebase origin "$GITHUB_REF_NAME" && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Коммиты, отправленные с GITHUB_TOKEN, сами не запускают сборку GitHub Pages
      # (так сказано в документации Pages), поэтому просим её явно.
      # Если Pages у вас настроен через собственный workflow («Source: GitHub Actions»),
      # замените этот шаг на запуск вашего deploy-workflow: gh workflow run <файл>.yml
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
